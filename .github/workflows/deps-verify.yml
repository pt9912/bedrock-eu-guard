name: deps-verify

# ADR-0004: Integrität von vendor/ gegen Upstream (braucht Netz, daher nicht
# Teil der netzlosen Gates). Läuft nur, wenn Abhängigkeiten geändert werden.
on:
  pull_request:
    paths:
      - vendor/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  deps-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make deps-verify
