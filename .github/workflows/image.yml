name: image

# Docker-Images bauen und testen (braucht Netz zum Ziehen der Basis-Images,
# daher nicht Teil der netzlosen Gates). Läuft nur bei Änderungen, die das Image betreffen.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - tools/image-smoke.sh
      - tools/feature-test.sh
      - devcontainer-feature/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - vendor/**
      - Makefile

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image-test
      - run: make feature-test
