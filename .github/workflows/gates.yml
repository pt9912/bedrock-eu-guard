name: gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Frischer Checkout: genau das, was committet ist (kein Arbeitsbaum-Ballast).
      - uses: actions/checkout@v4
      # doc-check + lint + test (containerisiert, Images per Digest gepinnt).
      - run: make gates
      # Self-Check: bedrock-eu-check gegen das eigene Repository (Exit 0 Pflicht, LH-QA-005).
      - run: make self-check
